spring:
  application:
    name: cine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

cine:
  cors:
    allowed-origins: ${CINE_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  admin:
    email: ${CINE_ADMIN_EMAIL:}
    password: ${CINE_ADMIN_PASSWORD:}
  jwt:
    # Sin valor por defecto a propósito: si falta CINE_JWT_SECRET el arranque falla, en lugar de
    # firmar tokens con una clave publicada en el repositorio. Mínimo 32 caracteres.
    secret: ${CINE_JWT_SECRET:}
    expiration: 15m
    refresh-expiration: 30d
    refresh-grace: ${CINE_REFRESH_GRACE_SECONDS:30}s
    refresh-sweep-delay: PT1H
    issuer: cine
  seat-hold:
    ttl: ${CINE_SEAT_HOLD_TTL_SECONDS:300}s
    sweep-delay: PT60S

management:
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs

server:
  port: 8080
logging:
  level:
    root: INFO